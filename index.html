<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔹 移动端菜单按钮 -->
  <div class="menu-toggle" onclick="toggleMenu()">☰ Menu</div>

  <!-- 🔹 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <img src="pages/CS.png" alt="Circle Spin Logo" class="sidebar-logo" />
      <h2>CS Tools</h2>
    </div>

    <ul>
      <!-- Home -->
      <li><a href="pages/Home.html" target="contentFrame" id="menuHome" class="active">Home</a></li>

      <!-- Tools -->
      <li><a href="pages/WIreCut.html" target="contentFrame">Wire EDM Calculator</a></li>
      <li><a href="pages/CSQR.html" target="contentFrame">QR & Barcode Generator</a></li>
      <li><a href="pages/MillingCalculator.html" target="contentFrame">Milling Calculator</a></li>
      <li><a href="pages/Test.html" target="contentFrame">Test</a></li>

      <!-- Turning submenu -->
      <li class="submenu">
        <a href="#" onclick="toggleSubmenu(event)">Turning Calculator ▸</a>
        <ul class="submenu-items">
          <li><a href="pages/Turning/Diagonal.html" target="contentFrame">Calculate Diagonal</a></li>
          <li><a href="pages/Turning/AngleFormula.html" target="contentFrame">Formula for Finding Angle</a></li>
          <li><a href="pages/Turning/DistanceFormula.html" target="contentFrame">Formula for Distance Calculation</a></li>
        </ul>
      </li>
    </ul>

    <footer>
      <p>© 2025 CircleSpin</p>
    </footer>
  </div>

  <!-- 🔹 主内容 iframe -->
  <div class="main-content">
    <div id="loading">Loading...</div>
    <iframe name="contentFrame" id="mainFrame"></iframe>
  </div>

  <!-- 🔹 脚本 -->
  <script>
    const iframe = document.getElementById("mainFrame");
    const loading = document.getElementById("loading");
    const menuLinks = document.querySelectorAll(".sidebar a[target='contentFrame']");

    // 页面加载默认打开 Home
    window.addEventListener("load", () => {
      const lastPage = localStorage.getItem("lastPage") || "pages/Home.html";
      iframe.src = lastPage;
      highlightMenu(lastPage);
    });

    // 菜单点击事件
    menuLinks.forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        const href = link.getAttribute("href");
        iframe.src = href;
        localStorage.setItem("lastPage", href);
        highlightMenu(href);
        document.querySelector(".sidebar").classList.remove("show");
      });
    });

    // iframe 加载完毕隐藏 Loading
    iframe.addEventListener("load", () => {
      loading.style.display = "none";
    });

    // 菜单高亮函数
    function highlightMenu(currentHref) {
      menuLinks.forEach(l => {
        const isActive = l.getAttribute("href") === currentHref;
        l.classList.toggle("active", isActive);
      });
    }

    // 移动端菜单
    function toggleMenu() {
      document.querySelector(".sidebar").classList.toggle("show");
    }

    // Turning submenu
    function toggleSubmenu(event) {
      event.preventDefault();
      const parent = event.target.closest(".submenu");
      parent.classList.toggle("open");
      const arrow = parent.querySelector("a");
      arrow.innerHTML = parent.classList.contains("open")
        ? "Turning Calculator ▾"
        : "Turning Calculator ▸";
    }

    // 让子页面也能切换工具（从 Home 的 Launch 按钮）
    window.showIframeWith = function (src) {
      iframe.src = src;
      localStorage.setItem("lastPage", src);
      highlightMenu(src);
    };
  </script>
</body>
</html>
